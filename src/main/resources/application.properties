quarkus.http.port=8080

# CORS override quarkus.http.cors.origins in production (e.g. via env var or profile)
# If the frontend is served from the same origin (port 8080) it never needed CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
quarkus.http.cors.methods=GET,OPTIONS
quarkus.http.cors.headers=accept,content-type

# Health endpoints (provided by quarkus-smallrye-health)
quarkus.smallrye-health.root-path=/q/health

# Cache of CELLAR existence checks (successful lookups only; errors are never cached)
quarkus.cache.caffeine."cellar-exists".expire-after-write=1H
quarkus.cache.caffeine."cellar-exists".maximum-size=10000

# Static files: short max-age so fixes reach browsers quickly after a deploy
quarkus.http.static-resources.max-age=5M

# Security headers (applied to every response, static files included).
# Styles stay 'unsafe-inline' because the page uses inline style attributes;
# all dynamic output is HTML-escaped, and no inline script is allowed.
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Referrer-Policy".value=no-referrer
quarkus.http.header."Permissions-Policy".value=camera=(), microphone=(), geolocation=()
# HSTS only in prod, where the app is served over HTTPS (via the reverse proxy)
%prod.quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains
# Dev mode: the Dev UI (/q/dev-ui) needs inline scripts, so only the app page gets the CSP
%dev.quarkus.http.header."Content-Security-Policy".path=/
