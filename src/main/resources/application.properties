quarkus.http.port=8080

# CORS – override quarkus.http.cors.origins in production (e.g. via env var or profile)
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
quarkus.http.cors.methods=GET,OPTIONS
quarkus.http.cors.headers=accept,content-type

# Health endpoints (provided by quarkus-smallrye-health)
quarkus.smallrye-health.root-path=/q/health
